spring.application.name=ms-usuarios
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/acis_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&connectionTimeZone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jackson.time-zone=America/Santiago
spring.jackson.serialization.write-dates-as-timestamps=false
